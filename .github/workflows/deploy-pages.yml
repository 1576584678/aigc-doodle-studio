name: Deploy to GitHub Pages

on:
  # 首次部署流程：先在仓库 Settings → Pages 把 Source 设为 GitHub Actions，
  # 再到 Actions 页手动 Run workflow 一次；确认成功后取消下面 push 的注释，
  # 即可启用「push 到 main 自动部署」。
  # 这样可避免 Pages 尚未启用时自动运行留下失败记录。
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 GitHub 官方 starter workflow 保持一致：不取消进行中的部署，
# 否则被中断的部署可能残留在 Pages 队列中，阻塞后续部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 项目页部署需要子路径；若改用自定义域名，改为 '/'
          VITE_BASE: /aigc-doodle-studio/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 兜底：即使 deploy-pages 卡在轮询，整个 job 也会在 10 分钟后终止
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 默认 10 分钟轮询太久；正常首次部署 1~3 分钟完成，
          # 5 分钟没成功就快速失败，并输出具体错误原因便于定位。
          timeout: 300000
          error_count: 20
